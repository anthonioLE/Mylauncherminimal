<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Launcher</title>
<style>
  /* u = 1 px del diseño de referencia (1280 x 720) */
  :root {
    --u: calc(100vw / 1280);
    --fg: #f1f5fb;
    --muted: #c9a3a8;
    --blue: #ff4d5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  /* Fondo fijo. Para un azul sólido sin imagen: borra la parte url(...) y deja solo el color. */
  body {
    font-family: Roboto, "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: #000 radial-gradient(900px 560px at 88% 112%, rgba(110,14,26,.55), rgba(0,0,0,0) 72%);
  }
  button { outline: none; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }

  /* ---------- Encabezado fijo ---------- */
  .top { position: fixed; left: 0; right: 0; top: 0; height: calc(200 * var(--u)); padding: calc(34 * var(--u)) calc(64 * var(--u)) 0; }
  .hello { text-shadow: 0 0 calc(10 * var(--u)) rgba(255,77,94,.75), 0 0 calc(26 * var(--u)) rgba(255,77,94,.4);}
  .clock { text-shadow: 0 0 calc(12 * var(--u)) rgba(255,77,94,.6), 0 0 calc(34 * var(--u)) rgba(255,77,94,.38); }
  .date { text-shadow: 0 0 calc(8 * var(--u)) rgba(255,77,94,.45); }
  .w-t { text-shadow: 0 0 calc(10 * var(--u)) rgba(255,77,94,.6), 0 0 calc(26 * var(--u)) rgba(255,77,94,.35); }
  .w-d, .w-s { text-shadow: 0 0 calc(7 * var(--u)) rgba(255,77,94,.4); }
  .hello { font-size: calc(28 * var(--u)); font-weight: 500; color: #ff9aa6; line-height: 1.1; }
  .clock { font-size: calc(80 * var(--u)); font-weight: 500; line-height: 1; letter-spacing: -.01em; margin-top: calc(6 * var(--u)); }
  .date { font-size: calc(24 * var(--u)); color: var(--muted); margin-top: calc(8 * var(--u)); }

  .right { position: absolute; right: calc(64 * var(--u)); top: calc(30 * var(--u)); display: flex; flex-direction: column; align-items: flex-end; }
  .icons { display: flex; align-items: center; }
  #wifi { width: calc(30 * var(--u)); height: calc(30 * var(--u)); margin-right: calc(16 * var(--u)); fill: none; stroke: #ffd3d7; stroke-width: 2; stroke-linecap: round; }
  #wifi.off { stroke: #7a5a5e; }
  #wifi .x { display: none; }
  #wifi.off .x { display: inline; }
  .settings {
    width: calc(52 * var(--u)); height: calc(52 * var(--u)); border-radius: calc(14 * var(--u));
    color: #ffd3d7; border: calc(2 * var(--u)) solid transparent;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease-out;
  }
  .settings svg { width: calc(30 * var(--u)); height: calc(30 * var(--u)); fill: currentColor; }
  .settings:focus { transform: scale(1.15); border-color: var(--blue); background: rgba(255,77,94,.16); box-shadow: 0 0 calc(14 * var(--u)) rgba(255,77,94,.55); }

  .weather { display: flex; align-items: center; margin-top: calc(20 * var(--u)); }
  .w-ico { font-size: calc(44 * var(--u)); line-height: 1; margin-right: calc(12 * var(--u)); }
  .w-t { font-size: calc(40 * var(--u)); font-weight: 500; line-height: 1; }
  .w-d { font-size: calc(18 * var(--u)); color: var(--fg); text-align: right; margin-top: calc(4 * var(--u)); }
  .w-s { font-size: calc(15 * var(--u)); color: var(--muted); text-align: right; margin-top: calc(2 * var(--u)); }
  .w-box { display: flex; flex-direction: column; align-items: flex-end; }
  .w-row { display: flex; align-items: center; }

  /* ---------- Filas de apps (solo esto se desplaza) ---------- */
  #view { position: fixed; left: 0; right: 0; top: calc(205 * var(--u)); bottom: 0; overflow: hidden; }
  #track { position: absolute; left: 0; right: 0; top: 0; transition: transform .22s ease-out; will-change: transform; }
  .row { height: calc(190 * var(--u)); padding: calc(14 * var(--u)) calc(44 * var(--u)) 0; display: flex; justify-content: space-between; opacity: 0; transition: opacity .2s linear; }
  .row.cur { opacity: 1; }
  .row.prev { opacity: 0; }
  .app { --c: #ff4d5e; --g: 255,77,94; width: calc(124 * var(--u)); display: flex; flex-direction: column; align-items: center; transition: transform .15s ease-out; }
  .tile {
    width: calc(124 * var(--u)); height: calc(124 * var(--u)); border-radius: calc(27 * var(--u));
    border: calc(3 * var(--u)) solid rgba(var(--g),.65);
    background: rgba(0,0,0,.55); overflow: hidden;
    box-shadow: 0 0 calc(12 * var(--u)) rgba(var(--g),.35), inset 0 0 calc(12 * var(--u)) rgba(var(--g),.16);
  }
  .tile img { width: 100%; height: 100%; display: block; }
  .tile.ln { display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
  .tile.ln svg { width: 56%; height: 56%; fill: none; stroke: var(--c); stroke-width: 1.8; filter: drop-shadow(0 0 calc(4 * var(--u)) rgba(var(--g),.85)); stroke-linecap: round; stroke-linejoin: round; }
  .app:focus .tile.ln svg { stroke-width: 2; }
  .name { margin-top: calc(8 * var(--u)); max-width: calc(132 * var(--u)); font-size: calc(17 * var(--u)); color: #fbe9ea; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app:focus { transform: scale(1.12); }
  .app:focus .tile { border-color: var(--c); box-shadow: 0 0 calc(26 * var(--u)) rgba(var(--g),.8), inset 0 0 calc(14 * var(--u)) rgba(var(--g),.25); }
  .app:focus .name { color: #fff; }
  /* Tarjeta grande de la app seleccionada */
  #hero { position: fixed; left: calc(64 * var(--u)); width: calc(590 * var(--u)); top: calc(228 * var(--u)); height: calc(250 * var(--u));
    border-radius: calc(32 * var(--u)); border: calc(3 * var(--u)) solid #ff4d5e;
    background: linear-gradient(135deg, #8c1424, #2a070c 75%);
    box-shadow: 0 0 calc(30 * var(--u)) rgba(255,77,94,.55), inset 0 0 calc(30 * var(--u)) rgba(255,77,94,.18);
    display: flex; align-items: center; padding: 0 calc(38 * var(--u)); }
  #heroIco { width: calc(150 * var(--u)); height: calc(150 * var(--u)); border-radius: calc(36 * var(--u)); border: calc(3 * var(--u)) solid rgba(255,140,150,.7);
    background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; }
  #heroIco svg { width: 62%; height: 62%; fill: none; stroke: #ffd3d7; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 calc(7 * var(--u)) rgba(255,77,94,.9)); }
  #heroIco img { width: 100%; height: 100%; display: block; }
  #heroTxt { margin-left: calc(34 * var(--u)); min-width: 0; flex: 1; }
  #heroName { font-size: calc(40 * var(--u)); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #heroSub { font-size: calc(20 * var(--u)); color: #ffb3ba; margin-top: calc(8 * var(--u)); }
  .empty { padding: calc(60 * var(--u)) calc(86 * var(--u)); font-size: calc(22 * var(--u)); color: var(--muted); }
</style>
</head>
<body>
  <div class="top">
    <div class="hello" id="hello"></div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>

    <div class="right">
      <div class="icons">
        <svg id="wifi" viewBox="0 0 24 24" style="visibility:hidden"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/><path class="x" d="M4 4l16 16"/></svg>
        <button class="settings" id="btnSettings" aria-label="Ajustes">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
      <div class="weather" id="weather">
        <div class="w-ico" id="wIco"></div>
        <div class="w-box">
          <div class="w-t" id="wT">--</div>
        </div>
      </div>
      <div class="w-d" id="wD">Clima no disponible</div>
      <div class="w-s" id="wS"></div>
    </div>
  </div>

  <div id="hero"><div id="heroIco"></div><div id="heroTxt"><div id="heroName"></div><div id="heroSub">Pulsa OK para abrir</div></div></div>

  <div id="view"><div id="track"></div></div>

<script>
(function () {
  /* ===== AJUSTES FÁCILES ===== */
  var CIUDAD = 'León, Gto.';
  var LAT = 21.1221, LON = -101.6824;
  var HORA_12 = false;                 // false = 17:54 (24 h)
  var POR_FILA = 8;                    // apps por fila
  var PINNED = [                       // van primero, en este orden (solo si están instaladas)
    'com.xuper.netxxus', 'com.netflix.ninja', 'com.google.android.youtube.tv',
    'com.amazon.amazonvideo.livingroom', 'com.disney.disneyplus', 'com.wbd.stream',
    'com.apple.atve.androidtv.appletv', 'com.spotify.tv.android', 'org.xbmc.kodi',
    'com.android.chrome', 'com.android.vending'
  ];
  var ICONOS_MINIMAL = true;           // false = usar siempre los iconos reales de las apps
  /* =========================== */

  // Iconos lineales propios (solo para las apps listadas; las demás conservan su icono real)
  var ICONS = {
    'com.android.chrome': '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M4.5 7.5h15M4.5 16.5h15"/>',
    'com.android.gallery3d': '<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3.5 17l5-5 4 4 3-3 5 5"/>',
    'com.android.music': '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
    'com.android.vending': '<path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    'com.google.android.youtube.tv': '<rect x="2.5" y="5" width="19" height="12.5" rx="2.5"/><path d="M10 8.7v5.6l4.8-2.8L10 8.7zM8 21h8"/>',
    'com.softwinner.TvdFileManager': '<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',
    'com.softwinner.miracastReceiver': '<rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8 20h8M12 16.5V20M8.5 10.5a5 5 0 0 1 7 0M10.3 12.6a2.3 2.3 0 0 1 3.4 0"/>',
    'com.xuper.netxxus': '<circle cx="12" cy="12" r="9"/><path d="M10 8.3v7.4l6-3.7-6-3.7z"/>'
  };

  // Color neón de cada app: [hex, 'r,g,b']; las demás usan rojo
  var NEON = {
    'com.xuper.netxxus': ['#9b6bff', '155,107,255'],
    'com.google.android.youtube.tv': ['#ff4d4d', '255,77,77'],
    'com.android.chrome': ['#3aa6ff', '58,166,255'],
    'com.android.vending': ['#2ee59d', '46,229,157'],
    'com.softwinner.TvdFileManager': ['#ffb02e', '255,176,46'],
    'com.android.gallery3d': ['#ff6bd6', '255,107,214'],
    'com.softwinner.miracastReceiver': ['#19d3da', '25,211,218'],
    'com.android.music': ['#ff7a45', '255,122,69']
  };

  var PITCH = 190;                     // alto de una fila (px de diseño)
  var SLOT = 325;                      // posición de la fila activa dentro del área desplazable
  var track = document.getElementById('track');
  var settings = document.getElementById('btnSettings');
  var rows = [];                       // rows[r] = [botones]
  var cur = { r: 0, c: 0 }, wantC = 0;

  function $(id) { return document.getElementById(id); }
  function unit() { return window.innerWidth / 1280; }

  /* ---------- Saludo, hora y fecha (sin reconstruir nada) ---------- */
  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto',
               'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var last = { clock: '', date: '', hello: '' };
  function set(id, key, v) { if (last[key] !== v) { last[key] = v; $(id).textContent = v; } }
  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes(), t;
    if (HORA_12) t = ('0' + (h % 12 || 12)).slice(-2) + ':' + ('0' + m).slice(-2) + (h < 12 ? ' AM' : ' PM');
    else t = ('0' + h).slice(-2) + ':' + ('0' + m).slice(-2);
    set('clock', 'clock', t);
    var ds = DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()];
    set('date', 'date', ds.charAt(0).toUpperCase() + ds.slice(1));
    set('hello', 'hello', h >= 5 && h < 12 ? 'Buenos días' : h >= 12 && h < 19 ? 'Buenas tardes' : 'Buenas noches');
  }
  tick();
  setInterval(tick, 10000);

  /* ---------- Wi-Fi ---------- */
  function net() {
    var w = $('wifi'), s = 'none';
    try { s = window.Android.getNet(); } catch (e) { return; }
    w.style.visibility = 'visible';
    var off = s === 'none';
    if (w.classList.contains('off') !== off) w.classList.toggle('off', off);
  }
  net();
  setInterval(net, 20000);

  /* ---------- Clima (Open-Meteo, sin clave) ---------- */
  var WX_KEY = 'wx1', wxTimer = 0;
  function wdesc(c) {
    if (c === 0) return 'Despejado';
    if (c === 1) return 'Mayormente despejado';
    if (c === 2) return 'Parcialmente nublado';
    if (c === 3) return 'Nublado';
    if (c === 45 || c === 48) return 'Niebla';
    if (c >= 51 && c <= 57) return 'Llovizna';
    if (c >= 61 && c <= 67) return 'Lluvia';
    if (c >= 71 && c <= 77) return 'Nieve';
    if (c >= 80 && c <= 82) return 'Chubascos';
    if (c === 85 || c === 86) return 'Nevadas';
    if (c >= 95) return 'Tormenta';
    return 'Variable';
  }
  function wicon(c, day) {
    if (c === 0) return day ? '☀️' : '🌙';
    if (c <= 2) return day ? '⛅' : '☁️';
    if (c === 3) return '☁️';
    if (c <= 48) return '🌫️';
    if (c <= 67 || (c >= 80 && c <= 82)) return '🌧️';
    if (c <= 77 || c === 85 || c === 86) return '❄️';
    return '⛈️';
  }
  function showWx(w, stale) {
    $('wIco').textContent = wicon(w.code, w.day);
    $('wT').textContent = Math.round(w.t) + '°C';
    $('wD').textContent = wdesc(w.code);
    var hh = new Date(w.ts);
    var s = 'Sensación ' + Math.round(w.f) + '°C · ' + CIUDAD;
    if (stale) s = 'Dato anterior (' + ('0' + hh.getHours()).slice(-2) + ':' + ('0' + hh.getMinutes()).slice(-2) + ') · ' + CIUDAD;
    $('wS').textContent = s;
  }
  function noWx() {
    $('wIco').textContent = '';
    $('wT').textContent = '';
    $('wD').textContent = 'Clima no disponible';
    $('wS').textContent = CIUDAD;
  }
  function cached() {
    try { var j = JSON.parse(localStorage.getItem(WX_KEY)); if (j && typeof j.t === 'number') return j; } catch (e) {}
    return null;
  }
  function weather() {
    clearTimeout(wxTimer);
    var retry = 5 * 60 * 1000;
    var done = false;
    function fail() {
      if (done) return; done = true;
      var c = cached();
      if (c) showWx(c, true); else noWx();
      wxTimer = setTimeout(weather, retry);
    }
    try {
      var ctl = window.AbortController ? new AbortController() : null;
      var to = setTimeout(function () { if (ctl) ctl.abort(); fail(); }, 12000);
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
        '&current=temperature_2m,apparent_temperature,weather_code,is_day';
      fetch(url, ctl ? { signal: ctl.signal } : undefined).then(function (r) {
        if (!r.ok) throw 0; return r.json();
      }).then(function (j) {
        clearTimeout(to);
        var c = j && j.current;
        if (!c || typeof c.temperature_2m !== 'number' || typeof c.weather_code !== 'number') throw 0;
        if (done) return; done = true;
        var w = { t: c.temperature_2m, f: typeof c.apparent_temperature === 'number' ? c.apparent_temperature : c.temperature_2m,
                  code: c.weather_code, day: c.is_day === 1, ts: Date.now() };
        try { localStorage.setItem(WX_KEY, JSON.stringify(w)); } catch (e) {}
        showWx(w, false);
        wxTimer = setTimeout(weather, 30 * 60 * 1000);
      }).catch(function () { clearTimeout(to); fail(); });
    } catch (e) { fail(); }
  }
  (function () { var c = cached(); if (c) showWx(c, true); else noWx(); })();
  weather();

  /* ---------- Apps ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  var lastRaw = null;
  function refresh(force) {
    var raw = '[]';
    try { raw = window.Android.getApps(); } catch (e) {}
    if (!force && raw === lastRaw) return;       // lista igual: no se toca el DOM
    lastRaw = raw;
    var apps = [];
    try { apps = JSON.parse(raw); } catch (e) {}

    var by = {}, used = {}, ordered = [];
    apps.forEach(function (a) { by[a.pkg] = a; });
    PINNED.forEach(function (p) { if (by[p] && !used[p]) { ordered.push(by[p]); used[p] = 1; } });
    apps.forEach(function (a) { if (!used[a.pkg]) { ordered.push(a); used[a.pkg] = 1; } });

    var ae = document.activeElement;
    var had = ae && ae.dataset ? ae.dataset.pkg : null;

    if (!ordered.length) {
      track.innerHTML = '<div class="empty">No se encontraron aplicaciones.</div>';
      rows = []; settings.focus(); return;
    }
    var html = '';
    for (var i = 0; i < ordered.length; i += POR_FILA) {
      html += '<div class="row">';
      ordered.slice(i, i + POR_FILA).forEach(function (a) {
        var ln = ICONOS_MINIMAL && ICONS[a.pkg];
        var nc = NEON[a.pkg];
        html += '<button class="app" data-pkg="' + esc(a.pkg) + '"' + (nc ? ' style="--c:' + nc[0] + ';--g:' + nc[1] + '"' : '') + '><div class="tile' + (ln ? ' ln' : '') + '">' +
          (ln ? '<svg viewBox="0 0 24 24">' + ln + '</svg>'
              : '<img alt="" decoding="async" src="https://icons.local/' + encodeURIComponent(a.pkg) + '">') +
          '</div><div class="name">' + esc(a.label) + '</div></button>';
      });
      html += '</div>';
    }
    track.innerHTML = html; shownRow = -1;
    var rowEls = track.querySelectorAll('.row');
    rows = [];
    for (var r = 0; r < rowEls.length; r++) rows.push(Array.prototype.slice.call(rowEls[r].querySelectorAll('.app')));

    var r0 = 0, c0 = 0;
    if (had) rows.forEach(function (row, r) { row.forEach(function (b, c) { if (b.dataset.pkg === had) { r0 = r; c0 = c; } }); });
    go(r0, c0, true);
  }

  /* ---------- Foco y desplazamiento vertical ---------- */
  var shownRow = -1;
  function scrollTo(r) {
    var y = (SLOT - r * PITCH) * unit();
    track.style.transform = 'translate3d(0,' + y + 'px,0)';
    if (r !== shownRow) {                 // solo se ve la fila activa y la anterior
      shownRow = r;
      for (var i = 0; i < track.children.length; i++) {
        track.children[i].className = 'row' + (i === r ? ' cur' : i === r - 1 ? ' prev' : '');
      }
    }
  }
  function go(r, c, keepWant) {
    if (!rows.length) return;
    r = Math.max(0, Math.min(rows.length - 1, r));
    c = Math.max(0, Math.min(rows[r].length - 1, c));
    cur.r = r; cur.c = c;
    if (!keepWant) wantC = c;
    scrollTo(r);
    var b = rows[r][c];
    if (document.activeElement !== b) b.focus({ preventScroll: true });
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k !== 'ArrowRight' && k !== 'ArrowLeft' && k !== 'ArrowDown' && k !== 'ArrowUp') return;
    e.preventDefault();
    var a = document.activeElement;
    if (a === settings) {
      if (k === 'ArrowDown' || k === 'ArrowLeft') go(cur.r, wantC, true);
      return;
    }
    if (!rows.length) return;
    // Si el foco se perdió, vuelve a la app actual
    if (!a || !a.dataset || !a.dataset.pkg) { go(cur.r, cur.c, true); return; }
    if (k === 'ArrowRight') go(cur.r, cur.c + 1);
    else if (k === 'ArrowLeft') go(cur.r, cur.c - 1);
    else if (k === 'ArrowDown') { if (cur.r < rows.length - 1) go(cur.r + 1, wantC, true); }
    else { if (cur.r > 0) go(cur.r - 1, wantC, true); else settings.focus({ preventScroll: true }); }
  });

  var heroPkg = '', heroIco = $('heroIco'), heroName = $('heroName');
  function setHero(b) {
    var pkg = b.dataset.pkg;
    if (!pkg || pkg === heroPkg) return;
    heroPkg = pkg;
    var ln = ICONOS_MINIMAL && ICONS[pkg];
    heroIco.innerHTML = ln ? '<svg viewBox="0 0 24 24">' + ln + '</svg>'
      : '<img alt="" src="https://icons.local/' + encodeURIComponent(pkg) + '">';
    heroName.textContent = b.querySelector('.name').textContent;
  }

  // Foco por cualquier otro medio (clic, etc.): mantener la fila visible
  track.addEventListener('focusin', function (e) {
    var b = e.target;
    setHero(b);
    for (var r = 0; r < rows.length; r++) {
      var c = rows[r].indexOf(b);
      if (c >= 0) { if (r !== cur.r || c !== cur.c) { cur.r = r; cur.c = c; wantC = c; scrollTo(r); } return; }
    }
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.id === 'btnSettings') { try { window.Android.openSettings(); } catch (x) {} return; }
    if (b.dataset.pkg) { try { window.Android.launch(b.dataset.pkg); } catch (x) {} }
  });

  window.onBack = function () { if (cur.r !== 0 || cur.c !== 0 || document.activeElement === settings) go(0, 0); };
  window.onHome = window.onBack;
  window.refreshApps = function () { tick(); net(); refresh(false); };
  window.addEventListener('resize', function () { scrollTo(cur.r); });
  refresh(true);
})();
</script>
</body>
</html>
